<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="title desc">
<title id="title">From curriculum to personalized feedback</title><desc id="desc">Conceptual research workflow: structure curriculum, retrieve evidence, reason about learning gaps, and support the learner.</desc>
<defs><radialGradient id="halo"><stop stop-color="#69e1d4" stop-opacity=".14"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/></radialGradient>
<linearGradient id="beam"><stop stop-color="#69e1d4"/><stop offset="1" stop-color="#a6a1ff"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#96a9c3" opacity=".16"/></pattern></defs>
<style>svg{--bg:#0b1220;--fg:#eef5ff;--muted:#96a9c3;--line:#24344d;--accent:#69e1d4;--violet:#a6a1ff;font-family:Inter,Segoe UI,Arial,sans-serif}
.flow{stroke-dasharray:5 16;animation:travel 8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes travel{to{stroke-dashoffset:-168}}@keyframes breathe{0%,100%{opacity:.15;transform:scale(.85)}50%{opacity:.4;transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
