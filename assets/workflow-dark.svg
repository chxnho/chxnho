ccent)" opacity="0.5"/><circle cx="550" cy="100" r="2" fill="var(--accent)" opacity="0.75"/></g><g transform="translate(0 0)"><path class="flow" d="M875 164 h28" stroke="var(--accent)" stroke-width="2"/><rect x="614" y="72" width="261" height="190" rx="16" fill="var(--bg)" stroke="var(--line)"/><text x="634" y="104" fill="var(--accent)" font-size="12" font-weight="600" >03</text><text x="634" y="156" fill="var(--fg)" font-size="28" font-weight="600" >Reason</text><text x="634" y="188" fill="var(--muted)" font-size="12" font-weight="400" >Investigate learning gaps</text><path d="M634 211 h221" stroke="var(--line)"/><text x="634" y="239" fill="var(--muted)" font-size="11" font-weight="400" >Agentic workflows</text><circle cx="819" cy="100" r="2" fill="var(--accent)" opacity="0.25"/><circle cx="829" cy="100" r="2" fill="var(--accent)" opacity="0.5"/><circle cx="839" cy="100" r="2" fill="var(--accent)" opacity="0.75"/></g><g transform="translate(0 0)"><rect x="903" y="72" width="261" height="190" rx="16" fill="var(--bg)" stroke="var(--line)"/><text x="923" y="104" fill="var(--accent)" font-size="12" font-weight="600" >04</text><text x="923" y="156" fill="var(--fg)" font-size="28" font-weight="600" >Support</text><text x="923" y="188" fill="var(--muted)" font-size="12" font-weight="400" >Personalized feedback</text><path d="M923 211 h221" stroke="var(--line)"/><text x="923" y="239" fill="var(--muted)" font-size="11" font-weight="400" >Educational applications</text><circle cx="1108" cy="100" r="2" fill="var(--accent)" opacity="0.25"/><circle cx="1118" cy="100" r="2" fill="var(--accent)" opacity="0.5"/><circle cx="1128" cy="100" r="2" fill="var(--accent)" opacity="0.75"/></g></svg>